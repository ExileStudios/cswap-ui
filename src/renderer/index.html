<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>cswap UI</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="bar">
      <div class="title">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1 class="name">Claude accounts</h1>
          <div class="sub" id="summary" aria-live="polite">Loading…</div>
        </div>
      </div>
      <nav class="actions">
        <button id="btn-refresh" type="button" title="Refresh now" aria-label="Refresh now">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
        </button>
        <button id="btn-compact" type="button" title="Compact view" aria-label="Compact view" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
        </button>
        <button id="btn-pin" type="button" title="Always on top" aria-label="Always on top" aria-pressed="false">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/></svg>
        </button>
        <button id="btn-menu" type="button" title="More options" aria-label="More options">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h.01M8 8h.01M12 8h.01" stroke-width="2.4"/></svg>
        </button>
        <button id="btn-hide" type="button" title="Hide (the tray icon brings it back)" aria-label="Hide">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg>
        </button>
      </nav>
    </header>
    <div id="error" class="error" role="alert" hidden></div>
    <main id="list"></main>
  </div>
</body>
</html>
